# Kubecost Helm values for EKS deployment
kubecostModel:
  imageVersion: "2.8.1"
  persistence:
    enabled: true
    storageClass: "gp2"
    size: "50Gi"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

prometheus:
  enabled: true
  server:
    persistentVolume:
      enabled: true
      storageClass: "gp2"
      size: "50Gi"

kubecostProductConfigs:
  clusterName: "eks-prod"
  cloudProvider: "AWS"
  costSources:
    - kubernetes
    - ebs
    - ec2
    - s3

serviceAccount:
  create: false
  name: kubecost

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:111122223333:certificate/xxxx
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  hosts:
    - host: kubecost.jhun80.click
      paths:
        - /
  tls: []

networkPolicies:
  enabled: false
